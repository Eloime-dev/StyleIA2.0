<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleIA - Mot de passe oublié</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="forgot-page">
        <header class="signup-header">
            <div class="logo-container">
                <img src="../assets/icons/logo_cintre.png" alt="Logo de StyleIA" class="logo-image">
                <h2 class="logo">Style<span>IA</span></h2>
            </div>
        </header>
        <section class="forgot-content">
            <h1>Mot de passe oublié</h1>
            <p class="forgot-description">Entrez votre adresse e-mail pour réinitialiser votre mot de passe.</p>
            <form class="forgot-form">
                <div class="form-group">
                    <label for="email">Adresse e-mail :</label>
                    <input type="email" id="email" name="email" placeholder="Entrez votre adresse e-mail" required>
                </div>
                <a href="nouveau-mot-de-passe.html" class="forgot-button">Réinitialiser le mot de passe</a>
                <p class="login-text">Vous vous souvenez de votre mot de passe ? <a href="connexion.html">Se connecter</a></p>
            </form>
