<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleIA - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="connexion-page">
        <header class="connexion-header">
            <div class="logo-container">
                <img src="../assets/icons/logo_cintre.png" alt="Logo de StyleIA" class="logo-image">
                <h2 class="logo">Style<span>IA</span></h2>
            </div>
        </header>
        <section class="connexion-content">
            <h1>Bon retourn sur StyleIA !</h1>
            <p class="connexion-description">Connectez-vous pour accéder à votre compte et découvrir des styles uniques qui correspondent à votre personnalité.</p>
            <form class="connexion-form" action="accueil.html" method="get">
                <div class="form-group">
                    <label for="email">Adresse e-mail :</label>
                    <input type="email" id="email" name="email" placeholder="Entrez votre adresse e-mail" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>
                </div>
                <a href="mot-de-passe-oublie.html" class="forgot-password-link">Mot de passe oublié ?</a>
                <button type="submit" class="connexion-button">Se connecter</button>
                <p class="signup-text">Vous n'avez pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
            </form>
        </section>
    </main>
</body>
</html>
