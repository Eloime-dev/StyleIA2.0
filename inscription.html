<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleIA - Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="signup-page">
        <header class="signup-header">
            <div class="logo-container">
                <img src="../assets/icons/logo_cintre.png" alt="Logo de StyleIA" class="logo-image">
                <h2 class="logo">Style<span>IA</span></h2>
            </div>
        </header>
        <section class="signup-content">
            <h1>Créer un compte</h1>
            <p class="signup-description">Rejoignez notre communauté et découvrez des styles uniques qui correspondent à votre personnalité.</p>
            <form class="signup-form" action="accueil.html" method="get">
                <div class="form-group">
                    <label for="fullname">Nom complet :</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-group">
                    <label for="email">Adresse e-mail :</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="signup-button">S'inscrire</button>
                <div class="social-separator"><span>Ou</span></div>
            </form>
            <div class="social-buttons">
                <button type="button" class="social-button">
                    <img src="../assets/icons/Google.png" alt="Google" class="social-icon">
                    Continuer avec Google</button>

                <button type="button" class="social-button">
                    <img src="../assets/icons/Apple.png" alt="Apple" class="social-icon">
                    Continuer avec Apple</button>
            </div>
            <p class="login-text">Vous avez déjà un compte ? <a href="connexion.html">Se connecter</a></p>
        </section>
    </main>
</body>
</html>
