<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleIA - Nouveau mot de passe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="new-password-page">
        <header class="new-password-header">
            <div class="logo-container">
                <img src="../assets/icons/logo_cintre.png" alt="Logo StyleIA" class="logo-image">
                <h2 class="logo">Style<span>IA</span></h2>
            </div>
        </header>
        <section class="new-password-content">
            <h1>Créer un nouveau mot de passe</h1>
            <p class="new-password-description">
                Choisissez un mot de passe sécurisé pour protéger votre compte.
            </p>
            <form class="new-password-form">
                <div class="form-group">
                    <label for="new-password">
                        Nouveau mot de passe :
                    </label>
                    <input type="password" id="new-password" name="new-password" placeholder="Entrez votre nouveau mot de passe" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">
                        Confirmer le mot de passe :
                    </label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmez votre mot de passe" required>
                </div>
                <button type="submit" class="new-password-button">
                    Réinitialiser le mot de passe
                </button>
            </form>
            <a href="connexion.html" class="back-login">
                ← Retour à la connexion
            </a>
        </section>
    </main>
</body>
</html>
